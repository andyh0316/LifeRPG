[build]
buildCommand = "cd /app && pnpm install && pnpm --filter @life-rpg/database build && pnpm --filter @life-rpg/api build"

[deploy]
preDeployCommand = "pnpm db:migrate"
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/api"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
