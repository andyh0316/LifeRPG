services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: haitianhong
      POSTGRES_PASSWORD: ''
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: life_rpg
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: haitianhong
      POSTGRES_PASSWORD: ''
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: life_rpg_test
    volumes:
      - pgdata-test:/var/lib/postgresql/data

volumes:
  pgdata:
  pgdata-test:
